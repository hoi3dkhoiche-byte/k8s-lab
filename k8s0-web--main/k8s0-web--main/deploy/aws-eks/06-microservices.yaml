# ==============================================================================
# 1. USER SERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: bida
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      serviceAccountName: bida-default-sa
      containers:
      - name: app
        image: user-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: bida
spec:
  selector:
    app: user-service
  ports:
  - port: 8000
    targetPort: 8000

---
