# ==============================================================================
# 5. NOTIFICATION WORKER
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: bida
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      serviceAccountName: bida-default-sa
      containers:
      - name: app
        image: notification-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
