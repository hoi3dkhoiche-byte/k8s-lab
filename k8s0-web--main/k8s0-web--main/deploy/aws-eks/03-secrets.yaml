apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: bida
type: Opaque
stringData:
  # ============================================================================
  # 1. JWT SECRET KEY (Chuỗi bảo mật để ký token đăng nhập)
  # ============================================================================
  SECRET_KEY: "bida-cao-cap-secret-key-production-aws-2024"

  # ============================================================================
  # 2. AMAZON RDS POSTGRESQL (USER DATABASE)
  # >>> THAY ĐỔI: Dán chuỗi kết nối RDS PostgreSQL của bạn vào đây <<<
  # Định dạng: postgresql://<user>:<password>@<rds-postgres-endpoint>:5432/user_db
  # ============================================================================
  POSTGRES_URL: "postgresql://dbadmin:YOUR_PG_PASSWORD@bida-postgres.xxxxxx.ap-southeast-1.rds.amazonaws.com:5432/user_db"

  # ============================================================================
  # 3. AMAZON RDS MYSQL (ORDER & INVENTORY DATABASE)
  # >>> THAY ĐỔI: Dán chuỗi kết nối RDS MySQL của bạn vào đây <<<
  # Định dạng: mysql+pymysql://<user>:<password>@<rds-mysql-endpoint>:3306/order_db
  # ============================================================================
  MYSQL_URL: "mysql+pymysql://dbadmin:YOUR_MYSQL_PASSWORD@bida-mysql.xxxxxx.ap-southeast-1.rds.amazonaws.com:3306/order_db"

  # ============================================================================
  # 4. AMAZON DOCUMENTDB (CATALOG DATABASE)
  # >>> THAY ĐỔI: Dán chuỗi kết nối DocumentDB Cluster của bạn vào đây <<<
  # Ghi chú: DocumentDB yêu cầu TLS và chứng chỉ global-bundle.pem (đã tích hợp sẵn trong container)
  # Định dạng: mongodb://<user>:<password>@<docdb-cluster-endpoint>:27017/catalog_db?tls=true&tlsCAFile=/app/certs/global-bundle.pem&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false
  # ============================================================================
  MONGO_URL: "mongodb://docdbadmin:YOUR_DOCDB_PASSWORD@bida-docdb.xxxxxx.ap-southeast-1.docdb.amazonaws.com:27017/catalog_db?tls=true&tlsCAFile=/app/certs/global-bundle.pem&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
