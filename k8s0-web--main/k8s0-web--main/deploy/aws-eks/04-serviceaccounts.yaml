apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service-sa
  namespace: bida
  annotations:
    # ==========================================================================
    # IAM ROLE FOR SERVICE ACCOUNT (IRSA) - CẤP QUYỀN TRUY CẬP S3 TỰ ĐỘNG
    # >>> THAY ĐỔI: Dán ARN IAM Role của bạn vào đây (nếu dùng IRSA trên EKS) <<<
    # Ví dụ: arn:aws:iam::123456789012:role/BidaCatalogS3AccessRole
    # ==========================================================================
    eks.amazonaws.com/role-arn: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/BidaCatalogS3AccessRole"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bida-default-sa
  namespace: bida
