<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Bida Cao Cấp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dark: '#0f0f0f', navy: '#1a1a2e', gold: '#c9a84c', 'gold-hover': '#d4a854' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white min-h-screen flex flex-col">

    <nav class="absolute top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <a href="index.html" class="inline-flex items-center gap-2 hover:opacity-80 transition">
                <i class="fa-solid fa-arrow-left text-gray-400"></i>
                <span class="text-sm font-medium">Quay lại trang chủ</span>
            </a>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">
        <!-- Background decorative -->
        <div class="absolute w-96 h-96 bg-gold/5 rounded-full blur-3xl -top-10 -left-10"></div>
        <div class="absolute w-96 h-96 bg-navy/40 rounded-full blur-3xl -bottom-10 -right-10"></div>
        
        <div class="glass p-8 md:p-10 rounded-2xl w-full max-w-md relative z-10 animate-slide-up">
            <div class="text-center mb-8">
                <span class="text-4xl text-gold mb-4 inline-block"><i class="fa-solid fa-billiard"></i></span>
                <h1 class="text-2xl font-serif font-bold tracking-wider">BIDA CAO CẤP</h1>
            </div>

            <!-- Tabs -->
            <div class="flex mb-8 border-b border-gray-700">
                <button id="tabLogin" class="flex-1 py-3 font-medium text-gold border-b-2 border-gold transition">Đăng Nhập</button>
                <button id="tabRegister" class="flex-1 py-3 font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-300 transition">Đăng Ký</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Tên đăng nhập / Email</label>
                    <input type="text" id="username" required class="form-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm text-gray-400">Mật khẩu</label>
                        <a href="#" class="text-xs text-gold hover:underline">Quên mật khẩu?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" required class="form-input w-full px-4 py-3 rounded-xl pr-10">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white" onclick="togglePassword('password')">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold uppercase tracking-wide mt-6">
                    Đăng Nhập
                </button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="registerForm" class="space-y-5 hidden">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Họ và tên</label>
                    <input type="text" id="regName" required placeholder="Nguyễn Văn A" class="form-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Email</label>
                    <input type="email" id="regEmail" required placeholder="email@example.com" class="form-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Tên đăng nhập</label>
                    <input type="text" id="regUsername" required placeholder="username" class="form-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Mật khẩu</label>
                    <div class="relative">
                        <input type="password" id="regPassword" required class="form-input w-full px-4 py-3 rounded-xl pr-10">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white" onclick="togglePassword('regPassword')">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold uppercase tracking-wide mt-6">
                    Tạo Tài Khoản
                </button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const formLogin = document.getElementById('loginForm');
        const formRegister = document.getElementById('registerForm');

        tabLogin.addEventListener('click', () => {
            tabLogin.className = 'flex-1 py-3 font-medium text-gold border-b-2 border-gold transition';
            tabRegister.className = 'flex-1 py-3 font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-300 transition';
            formLogin.classList.remove('hidden');
            formRegister.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.className = 'flex-1 py-3 font-medium text-gold border-b-2 border-gold transition';
            tabLogin.className = 'flex-1 py-3 font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-300 transition';
            formRegister.classList.remove('hidden');
            formLogin.classList.add('hidden');
        });

        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = formLogin.querySelector('button');
            const ogText = btn.textContent;
            btn.innerHTML = '<div class="spinner w-5 h-5 mx-auto"></div>';
            btn.disabled = true;
            
            try {
                const res = await Api.auth.login(document.getElementById('username').value.trim(), document.getElementById('password').value);
                showToast('Đăng nhập thành công!');
                const user = res.user || Api.auth.getUser();
                const isAdmin = user && user.role === 'admin';
                setTimeout(() => {
                    if (isAdmin) {
                        window.location.href = 'admin.html';
                    } else {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirect = urlParams.get('redirect') || 'index.html';
                        window.location.href = redirect;
                    }
                }, 800);
            } catch (err) {
                showToast(err.message || 'Đăng nhập thất bại', 'error');
                btn.textContent = ogText;
                btn.disabled = false;
            }
        });
        
        // Real register handler
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = formRegister.querySelector('button');
            const ogText = btn.textContent;
            btn.innerHTML = '<div class="spinner w-5 h-5 mx-auto"></div> Đang tạo tài khoản...';
            btn.disabled = true;

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;

            try {
                await Api.auth.register(username, email, password, name);
                showToast('Đăng ký thành công! Đang chuyển hướng...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (err) {
                showToast(err.message || 'Đăng ký thất bại', 'error');
                btn.textContent = ogText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
