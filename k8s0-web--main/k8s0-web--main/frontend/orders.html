<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Tôi | Bida Cao Cấp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dark: '#0f0f0f', navy: '#1a1a2e', gold: '#c9a84c' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white pt-24 pb-16">

    <nav class="fixed top-0 left-0 right-0 glass-nav z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="text-3xl text-gold"><i class="fa-solid fa-billiard"></i></span>
                    <span class="font-serif font-bold text-2xl tracking-wider text-white">BIDA <span class="text-gold">CAO CẤP</span></span>
                </a>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="text-gray-300 hover:text-gold transition">Trang chủ</a>
                    <a href="products.html" class="text-gray-300 hover:text-gold transition">Tất cả sản phẩm</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="cart.html" class="relative text-white hover:text-gold transition mr-2">
                        <i class="fa-solid fa-shopping-cart text-xl"></i>
                        <span id="cartBadge" class="cart-badge hidden">0</span>
                    </a>
                    <div class="relative group" id="userMenu"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-serif font-bold">Lịch Sử Đơn Hàng</h1>
            <a href="products.html" class="btn-outline px-4 py-2 rounded-lg text-sm font-medium">Tiếp tục mua sắm</a>
        </div>
        
        <div id="ordersList" class="space-y-6">
            <!-- Loader -->
            <div class="flex justify-center py-10"><div class="spinner"></div></div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!Api.getToken()) {
                window.location.href = 'login.html?redirect=orders.html';
                return;
            }
            loadOrders();
        });

        async function loadOrders() {
            const container = document.getElementById('ordersList');
            try {
                const orders = await Api.order.getMyOrders();
                
                if (!orders || orders.length === 0) {
                    container.innerHTML = `
                        <div class="glass p-12 text-center rounded-2xl">
                            <i class="fa-solid fa-receipt text-5xl text-gray-500 mb-4 block"></i>
                            <h3 class="text-xl font-bold mb-2">Bạn chưa có đơn hàng nào</h3>
                            <p class="text-gray-400 mb-6">Hãy khám phá bộ sưu tập sản phẩm phong phú và đặt hàng ngay.</p>
                            <a href="products.html" class="btn-primary px-6 py-2.5 rounded-full inline-block font-semibold text-sm">Mua sắm ngay</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(o => {
                    const dateStr = o.created_at ? new Date(o.created_at).toLocaleString('vi-VN') : 'Mới đặt';
                    const itemsCount = o.items ? o.items.length : 0;
                    const itemsDetails = o.items ? o.items.map(it => `
                        <div class="flex justify-between items-center py-2 text-sm text-gray-300 border-b border-gray-800 last:border-0">
                            <span>${it.product_name || 'Sản phẩm'} x ${it.quantity}</span>
                            <span class="text-gold">${App.formatPrice(it.unit_price * it.quantity)}</span>
                        </div>
                    `).join('') : '';

                    const canCancel = o.status === 'pending' || o.status === 'confirmed';

                    return `
                    <div class="glass rounded-xl overflow-hidden hover:border-gold/40 transition">
                        <div class="p-6 border-b border-gray-800 flex flex-wrap justify-between items-center gap-4 bg-navy/20">
                            <div>
                                <div class="font-bold text-lg text-white">#BIDA-${o.id}</div>
                                <div class="text-sm text-gray-400 mt-1">Đặt lúc: ${dateStr}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-gold font-bold text-lg">${App.formatPrice(o.total_amount)}</div>
                                <div class="text-sm text-gray-400">${itemsCount} món hàng</div>
                            </div>
                            <div class="flex items-center gap-3">
                                ${getStatusBadge(o.status)}
                                ${canCancel ? `<button onclick="cancelOrder(${o.id})" class="px-3 py-1 text-xs font-semibold rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 transition">Hủy đơn</button>` : ''}
                            </div>
                        </div>
                        ${itemsDetails ? `<div class="p-4 bg-black/20">${itemsDetails}</div>` : ''}
                    </div>
                    `;
                }).join('');
            } catch (err) {
                console.error("Lỗi lấy đơn hàng:", err);
                container.innerHTML = `
                    <div class="glass p-8 text-center rounded-xl text-red-400">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 block"></i>
                        Không thể tải danh sách đơn hàng. Vui lòng thử lại sau.
                    </div>
                `;
            }
        }

        function getStatusBadge(status) {
            const map = {
                'pending': '<span class="px-3 py-1 bg-yellow-500/20 text-yellow-400 text-sm rounded-full border border-yellow-500/30">Chờ thanh toán</span>',
                'confirmed': '<span class="px-3 py-1 bg-blue-400/20 text-blue-300 text-sm rounded-full border border-blue-400/30">Đã xác nhận</span>',
                'paid': '<span class="px-3 py-1 bg-blue-500/20 text-blue-400 text-sm rounded-full border border-blue-500/30">Đã thanh toán</span>',
                'shipped': '<span class="px-3 py-1 bg-purple-500/20 text-purple-400 text-sm rounded-full border border-purple-500/30">Đang giao hàng</span>',
                'delivered': '<span class="px-3 py-1 bg-green-500/20 text-green-400 text-sm rounded-full border border-green-500/30">Đã giao hàng</span>',
                'cancelled': '<span class="px-3 py-1 bg-red-500/20 text-red-400 text-sm rounded-full border border-red-500/30">Đã huỷ</span>',
            };
            return map[status] || map.pending;
        }

        async function cancelOrder(orderId) {
            if (!confirm(`Bạn có chắc muốn hủy đơn hàng #BIDA-${orderId}?`)) return;
            try {
                await Api.order.cancelOrder(orderId);
                showToast('Đã hủy đơn hàng thành công', 'success');
                loadOrders();
            } catch (err) {
                showToast('Không thể hủy đơn: ' + (err.message || 'Lỗi không xác định'), 'error');
            }
        }
    </script>
</body>
</html>
