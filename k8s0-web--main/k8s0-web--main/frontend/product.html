<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm | Bida Cao Cấp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { dark: '#0f0f0f', navy: '#1a1a2e', gold: '#c9a84c', 'gold-hover': '#d4a854', green: '#2d5016' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white pt-24 pb-16">

    <!-- Navbar (Simplified for include) -->
    <nav class="fixed top-0 left-0 right-0 glass-nav z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="text-3xl text-gold"><i class="fa-solid fa-billiard"></i></span>
                    <span class="font-serif font-bold text-2xl tracking-wider text-white">BIDA <span class="text-gold">CAO CẤP</span></span>
                </a>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="text-gray-300 hover:text-gold transition">Trang chủ</a>
                    <a href="products.html" class="text-gold font-medium hover:text-gold-hover transition">Tất cả sản phẩm</a>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="cart.html" class="relative text-white hover:text-gold transition">
                        <i class="fa-solid fa-shopping-cart text-xl"></i>
                        <span id="cartBadge" class="cart-badge hidden">0</span>
                    </a>
                    <div class="relative group" id="userMenu">
                        <a href="login.html" id="loginLink" class="text-white hover:text-gold transition">
                            <i class="fa-regular fa-user text-xl"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Breadcrumb -->
        <nav class="text-sm text-gray-400 mb-8 flex items-center gap-2">
            <a href="index.html" class="hover:text-gold">Trang chủ</a>
            <i class="fa-solid fa-chevron-right text-xs"></i>
            <a href="index.html#products" class="hover:text-gold">Sản phẩm</a>
            <i class="fa-solid fa-chevron-right text-xs"></i>
            <span class="text-gold" id="bc-name">Chi tiết</span>
        </nav>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12" id="productDetail">
            <!-- Loading Skeleton -->
            <div class="skeleton h-[500px] rounded-2xl"></div>
            <div class="flex flex-col gap-4">
                <div class="skeleton h-10 w-3/4 rounded"></div>
                <div class="skeleton h-8 w-1/4 rounded"></div>
                <div class="skeleton h-32 w-full rounded mt-4"></div>
        </div>

        <!-- Related Products Section -->
        <div id="relatedSection" class="mt-20 pt-12 border-t border-gold/20">
            <h2 class="text-2xl md:text-3xl font-serif font-bold text-white mb-8">Sản Phẩm <span class="text-gold">Cùng Loại</span></h2>
            <div id="relatedProducts" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"></div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentProduct = null;
        let currentQty = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || 1;
            await loadProduct(id);
        });

        async function loadProduct(id) {
            try {
                const product = await Api.catalog.getProduct(id);
                currentProduct = product;
                renderProductDetail(product);
                loadRelatedProducts(product.category, product.id);
            } catch (error) {
                console.error("Lỗi khi tải chi tiết sản phẩm:", error);
                showToast("Không tìm thấy thông tin sản phẩm", "error");
            }
        }

        async function loadRelatedProducts(category, currentId) {
            const relatedContainer = document.getElementById('relatedProducts');
            if (!relatedContainer) return;
            try {
                const res = await Api.catalog.getProducts({ category });
                const related = (res.items || []).filter(p => p.id !== currentId).slice(0, 4);
                if (related.length > 0) {
                    renderProducts(related, relatedContainer);
                } else {
                    document.getElementById('relatedSection')?.classList.add('hidden');
                }
            } catch (e) {
                console.error("Lỗi tải sản phẩm liên quan:", e);
            }
        }

        function renderProductDetail(p) {
            document.getElementById('bc-name').textContent = p.name;
            
            const specHtml = p.specs ? Object.entries(p.specs).map(([k, v]) => `
                <div class="flex py-3 border-b border-gray-800">
                    <span class="w-2/5 text-gray-400 font-medium">${k}</span>
                    <span class="w-3/5 text-white font-medium">${v}</span>
                </div>
            `).join('') : '<p class="text-gray-400 py-2">Đang cập nhật thông số.</p>';

            const categoryText = p.categoryName || (p.category === 'cues' ? 'Gậy Pool Cao Cấp' : p.category === 'cases' ? 'Bao & Hộp Gậy' : 'Phụ Kiện Chuyên Nghiệp');
            const imgUrl = p.img || (p.images && p.images.length > 0 ? p.images[0] : 'images/cat-cues.jpg');
            const descText = p.desc || p.description || 'Sản phẩm nhập khẩu chính hãng tiêu chuẩn quốc tế, bảo hành chu đáo.';

            const html = `
                <!-- Image -->
                <div class="glass rounded-2xl overflow-hidden p-3 flex items-center justify-center bg-black/50 border border-gold/20">
                    <img src="${imgUrl}" alt="${p.name}" class="w-full max-h-[520px] object-cover rounded-xl shadow-2xl" onerror="this.src='images/cat-cues.jpg'">
                </div>

                <!-- Info -->
                <div class="flex flex-col">
                    <span class="text-gold text-xs font-semibold tracking-widest uppercase mb-2 bg-gold/10 inline-block px-3 py-1 rounded-full border border-gold/30 w-max">${categoryText}</span>
                    <h1 class="text-3xl md:text-4xl font-serif font-bold text-white mb-3 leading-tight">${p.name}</h1>
                    <div class="text-3xl font-bold text-gold mb-6">${App.formatPrice(p.price)}</div>
                    
                    <div class="flex items-center gap-2 mb-6">
                        <div class="w-3 h-3 rounded-full ${p.stock ? 'bg-green-500 animate-pulse' : 'bg-red-500'}"></div>
                        <span class="text-sm font-medium ${p.stock ? 'text-green-400' : 'text-red-400'}">${p.stock ? 'Còn hàng sẵn sàng giao ngay' : 'Tạm hết hàng'}</span>
                    </div>

                    <p class="text-gray-300 leading-relaxed mb-8 text-base border-t border-b border-gray-800 py-4">${descText}</p>

                    <!-- Quantity & Actions -->
                    <div class="glass p-6 rounded-2xl mb-10 border border-gold/20">
                        <div class="text-sm text-gray-400 mb-3 font-medium">Chọn số lượng:</div>
                        <div class="flex flex-col sm:flex-row items-center gap-4">
                            <div class="flex items-center border border-gold/40 rounded-xl overflow-hidden bg-dark/70 w-full sm:w-auto justify-between">
                                <button onclick="updateQty(-1)" class="w-12 h-12 flex items-center justify-center text-gold hover:bg-gold/20 transition text-lg font-bold"><i class="fa-solid fa-minus"></i></button>
                                <span id="qtyDisplay" class="w-14 text-center font-bold text-lg text-white">1</span>
                                <button onclick="updateQty(1)" class="w-12 h-12 flex items-center justify-center text-gold hover:bg-gold/20 transition text-lg font-bold"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            
                            <button onclick="addCurrentToCart()" class="w-full sm:flex-1 h-12 rounded-xl font-semibold text-sm uppercase tracking-wider flex items-center justify-center gap-2 bg-white/10 text-gold border border-gold/40 hover:bg-gold/20 transition">
                                <i class="fa-solid fa-cart-shopping"></i> Thêm vào giỏ
                            </button>

                            <button onclick="buyCurrentNow()" class="w-full sm:flex-1 h-12 rounded-xl font-bold text-sm uppercase tracking-wider flex items-center justify-center gap-2 btn-primary shadow-lg hover:brightness-110 transition">
                                <i class="fa-solid fa-bolt"></i> Mua ngay
                            </button>
                        </div>
                    </div>

                    <!-- Specs -->
                    <div>
                        <h3 class="font-serif text-xl font-bold mb-4 text-white border-b-2 border-gold pb-2 inline-block">Thông Số Kỹ Thuật</h3>
                        <div class="text-sm bg-navy/30 p-4 rounded-xl border border-gray-800">
                            ${specHtml}
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('productDetail').innerHTML = html;
        }

        function updateQty(change) {
            currentQty += change;
            if (currentQty < 1) currentQty = 1;
            const display = document.getElementById('qtyDisplay');
            if (display) display.textContent = currentQty;
        }

        async function addCurrentToCart() {
            if (!currentProduct) return;
            try {
                await Api.cart.addToCart(currentProduct.id, currentQty, {
                    name: currentProduct.name,
                    price: currentProduct.price,
                    img: currentProduct.img
                });
                window.dispatchEvent(new Event('cartUpdated'));
                showToast(`Đã thêm ${currentQty} "${currentProduct.name}" vào giỏ hàng`);
            } catch (e) {
                showToast('Có lỗi xảy ra khi thêm giỏ hàng', 'error');
            }
        }

        async function buyCurrentNow() {
            if (!currentProduct) return;
            try {
                await Api.cart.addToCart(currentProduct.id, currentQty, {
                    name: currentProduct.name,
                    price: currentProduct.price,
                    img: currentProduct.img
                });
                window.dispatchEvent(new Event('cartUpdated'));
                showToast(`Đang chuyển đến giỏ hàng...`);
                setTimeout(() => {
                    window.location.href = 'cart.html';
                }, 300);
            } catch (e) {
                showToast('Có lỗi xảy ra', 'error');
            }
        }
    </script>
</body>
</html>
