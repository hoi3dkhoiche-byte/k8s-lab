<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Tôi | Bida Cao Cấp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dark: '#0f0f0f', navy: '#1a1a2e', gold: '#c9a84c' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white pt-24 pb-16">

    <nav class="fixed top-0 left-0 right-0 glass-nav z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="text-3xl text-gold"><i class="fa-solid fa-billiard"></i></span>
                    <span class="font-serif font-bold text-2xl tracking-wider text-white">BIDA <span class="text-gold">CAO CẤP</span></span>
                </a>
                <div class="flex items-center space-x-4">
                    <div class="relative group" id="userMenu"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-3xl font-serif font-bold mb-8">Lịch Sử Đơn Hàng</h1>
        
        <div id="ordersList" class="space-y-6">
            <!-- Loader -->
            <div class="flex justify-center py-10"><div class="spinner"></div></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!Api.getToken()) {
                window.location.href = 'login.html';
                return;
            }
            loadOrders();
        });

        function loadOrders() {
            setTimeout(() => {
                const orders = [
                    { id: 'BIDA-948123', date: '2026-08-25', status: 'delivered', total: 25500000, items: 1 },
                    { id: 'BIDA-112349', date: '2026-08-26', status: 'pending', total: 4500000, items: 2 }
                ];
                
                const container = document.getElementById('ordersList');
                
                if (orders.length === 0) {
                    container.innerHTML = '<div class="glass p-10 text-center rounded-xl"><p class="text-gray-400">Bạn chưa có đơn hàng nào.</p></div>';
                    return;
                }

                container.innerHTML = orders.map(o => `
                    <div class="glass rounded-xl overflow-hidden">
                        <div class="p-6 border-b border-gray-800 flex flex-wrap justify-between items-center gap-4 bg-navy/20">
                            <div>
                                <div class="font-bold text-lg text-white">#${o.id}</div>
                                <div class="text-sm text-gray-400 mt-1">Đặt ngày: ${o.date}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-gold font-bold">${App.formatPrice(o.total)}</div>
                                <div class="text-sm text-gray-400">${o.items} sản phẩm</div>
                            </div>
                            <div>
                                ${getStatusBadge(o.status)}
                            </div>
                        </div>
                    </div>
                `).join('');
            }, 800);
        }

        function getStatusBadge(status) {
            const map = {
                'pending': '<span class="px-3 py-1 bg-yellow-500/20 text-yellow-400 text-sm rounded-full border border-yellow-500/30">Chờ xử lý</span>',
                'paid': '<span class="px-3 py-1 bg-blue-500/20 text-blue-400 text-sm rounded-full border border-blue-500/30">Đã thanh toán</span>',
                'shipped': '<span class="px-3 py-1 bg-purple-500/20 text-purple-400 text-sm rounded-full border border-purple-500/30">Đang giao hàng</span>',
                'delivered': '<span class="px-3 py-1 bg-green-500/20 text-green-400 text-sm rounded-full border border-green-500/30">Đã giao</span>',
            };
            return map[status] || map.pending;
        }
    </script>
</body>
</html>
