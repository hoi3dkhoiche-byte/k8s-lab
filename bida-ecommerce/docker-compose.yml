version: '3.8'

services:
  # ==============================================================================
  # Database Tier
  # ==============================================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: bida-postgres-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: bida-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: order_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-db:
    image: mongo:6.0
    container_name: bida-mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-db:
    image: redis:7-alpine
    container_name: bida-redis-db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================================
  # Message Queue (Kafka & Zookeeper)
  # ==============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bida-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bida-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==============================================================================
  # Application Services
  # ==============================================================================
  # 1. User & Auth Service
  user-service:
    build: ./services/user-service
    container_name: bida-user-service
    ports:
      - "8001:8001"
    environment:
      POSTGRES_URL: postgresql://admin:admin123@postgres-db:5432/user_db
      SECRET_KEY: bida-cao-cap-secret-key-2024
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./services/user-service:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 2. Catalog Service
  catalog-service:
    build: ./services/catalog-service
    container_name: bida-catalog-service
    ports:
      - "8002:8002"
    environment:
      MONGO_URL: mongodb://admin:admin123@mongo-db:27017/
      REDIS_URL: redis://redis-db:6379/0
      ORDER_SERVICE_URL: http://order-service:8004
      SECRET_KEY: bida-cao-cap-secret-key-2024
    depends_on:
      mongo-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    volumes:
      - ./services/catalog-service:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 3. Cart Service
  cart-service:
    build: ./services/cart-service
    container_name: bida-cart-service
    ports:
      - "8003:8003"
    environment:
      REDIS_URL: redis://redis-db:6379/0
      CATALOG_SERVICE_URL: http://catalog-service:8002
      SECRET_KEY: bida-cao-cap-secret-key-2024
    depends_on:
      redis-db:
        condition: service_healthy
    volumes:
      - ./services/cart-service:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 4. Order & Payment Service
  order-service:
    build: ./services/order-service
    container_name: bida-order-service
    ports:
      - "8004:8004"
    environment:
      MYSQL_URL: mysql+pymysql://admin:admin123@mysql-db:3306/order_db
      KAFKA_BOOTSTRAP: kafka:9092
      CART_SERVICE_URL: http://cart-service:8003
      CATALOG_SERVICE_URL: http://catalog-service:8002
      SECRET_KEY: bida-cao-cap-secret-key-2024
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/order-service:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 5. API Gateway (Reverse Proxy / Routing)
  api-gateway:
    build: ./services/api-gateway
    container_name: bida-api-gateway
    ports:
      - "8000:80"
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped

  # Worker bất đồng bộ nhận sự kiện Kafka
  notification-worker:
    build: ./notification-worker
    container_name: bida-notification-worker
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      MONGO_URL: mongodb://admin:admin123@mongo-db:27017/
    depends_on:
      kafka:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    restart: unless-stopped

  # Giao diện Frontend (Nginx phục vụ UI & gọi API Gateway)
  frontend:
    build: ./frontend
    container_name: bida-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:
